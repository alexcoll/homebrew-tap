name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-linuxbrew:
    name: brew install (Linuxbrew)
    runs-on: ubuntu-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Tap local copy of alexcoll/tap
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          TAP_DIR="$(brew --repository)/Library/Taps/alexcoll/homebrew-tap"
          mkdir -p "$TAP_DIR"
          cp -R . "$TAP_DIR"
          git -C "$TAP_DIR" init -q
          git -C "$TAP_DIR" add -A
          git -C "$TAP_DIR" commit -qm init
          brew tap alexcoll/tap

      - name: Install formula from source
        run: brew install --build-from-source bandcamp-dl-rb

      - name: Run formula test
        run: brew test bandcamp-dl-rb

      - name: Run the CLI
        run: bandcamp_dl_rb --help | grep -q 'bandcamp_dl_rb'

      - name: Audit formula
        run: brew audit --strict ./Formula/bandcamp-dl-rb.rb